[package]
name = "lotus_engine"
version = "0.3.8"
authors = ["Alexandre Zeni <zenialexandre123@gmail.com>"]
description = "Lotus is a game engine with the main focus of being easy-to-use and straight forward on developing 2D games."
license = "MPL-2.0"
edition = "2021"
repository = "https://github.com/zenialexandre/lotus"
documentation = "https://docs.rs/lotus_engine"

[dependencies]
lotus_proc_macros = { path = "lotus_proc_macros", version = "0.1.1" }
winit = { version = "0.30.13", features = ["rwh_05"] }
wgpu = "30.0.1"
gilrs = "0.11.1"
kira = "0.12.5"
cpal = "0.18.2"
wgpu_text = "30.0.1"
glam = "0.34.0"
image = { version = "0.25.10", features = ["png", "jpeg"] }
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = [ "derive" ] }
anyhow = "1.0.104"
uuid = { version = "1.27.0", features = ["v4"] }
rand = "0.10.3"
atomic_refcell = "0.1.14"
once_cell = "1.21.3"
env_logger = "0.11.10"
log = "0.4.35"

[profile.dev]
opt-level = 0

[profile.release]
opt-leve = 3
